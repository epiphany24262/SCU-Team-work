<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健身房管理系统 - 登录</title>
    <!-- Element UI 样式 -->
    <link rel="stylesheet" href="css/lib/index.min.css">
    <!-- Font Awesome 图标 -->
    <link rel="stylesheet" href="css/lib/all.min.css">
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
<div id="app">
    <div class="login-container">
        <div class="login-header">
            <div class="login-icon">
                <i class="fas fa-dumbbell"></i>
            </div>
            <div class="login-title">健身房管理系统</div>
            <div class="login-subtitle">欢迎登录您的账户</div>
        </div>

        <el-form :model="loginForm" :rules="loginRules" ref="loginForm">
            <div class="form-item">
                <el-form-item prop="username">
                    <el-input
                            v-model="loginForm.username"
                            placeholder="用户名"
                            prefix-icon="el-icon-user"
                            size="medium">
                    </el-input>
                </el-form-item>
            </div>

            <div class="form-item">
                <el-form-item prop="password">
                    <el-input
                            v-model="loginForm.password"
                            type="password"
                            placeholder="密码"
                            prefix-icon="el-icon-lock"
                            size="medium"
                            show-password>
                    </el-input>
                </el-form-item>
            </div>

            <div class="login-actions">
                <el-button
                        type="primary"
                        class="login-button"
                        @click="handleLogin"
                        :loading="loading">
                    登录
                </el-button>
                <a class="register-link" @click="showRegisterDialog = true">
                    <i class="fas fa-user-plus"></i> 注册账号
                </a>
            </div>
        </el-form>
    </div>

    <!-- 注册对话框 -->
    <el-dialog
            title="注册账号"
            :visible.sync="showRegisterDialog"
            width="500px"
            @close="handleRegisterClose">
        <el-form
                :model="registerForm"
                :rules="registerRules"
                ref="registerForm"
                label-width="80px">
            <el-form-item label="用户名" prop="username">
                <el-input
                        v-model="registerForm.username"
                        placeholder="请输入用户名"
                        @blur="checkUsername">
                    <template slot="append">
                        <el-button
                                @click="checkUsername"
                                :loading="checkingUsername"
                                size="mini">
                            检查
                        </el-button>
                    </template>
                </el-input>
                <div v-if="usernameStatus === 'available'" style="color: #67C23A; font-size: 12px; margin-top: 5px;">
                    <i class="el-icon-success"></i> 用户名可用
                </div>
                <div v-else-if="usernameStatus === 'exists'" style="color: #F56C6C; font-size: 12px; margin-top: 5px;">
                    <i class="el-icon-error"></i> 用户名已存在
                </div>
            </el-form-item>

            <el-form-item label="密码" prop="password">
                <el-input
                        v-model="registerForm.password"
                        type="password"
                        placeholder="请输入密码"
                        show-password>
                </el-input>
            </el-form-item>

            <el-form-item label="确认密码" prop="confirmPassword">
                <el-input
                        v-model="registerForm.confirmPassword"
                        type="password"
                        placeholder="请再次输入密码"
                        show-password>
                </el-input>
            </el-form-item>

            <el-form-item label="真实姓名" prop="realName">
                <el-input
                        v-model="registerForm.realName"
                        placeholder="请输入真实姓名">
                </el-input>
            </el-form-item>

            <el-form-item label="手机号" prop="phone">
                <el-input
                        v-model="registerForm.phone"
                        placeholder="请输入手机号">
                </el-input>
            </el-form-item>
        </el-form>

        <div slot="footer" class="dialog-footer">
            <el-button @click="showRegisterDialog = false">取消</el-button>
            <el-button
                    type="primary"
                    @click="handleRegister"
                    :loading="registerLoading"
                    :disabled="usernameStatus !== 'available'">
                注册
            </el-button>
        </div>
    </el-dialog>
</div>

<!-- Vue 和 Element UI -->
<script src="js/lib/vue.min.js"></script>
<script src="js/lib/index.min.js"></script>
<script src="js/lib/axios.min.js"></script>

<script>
    new Vue({
        el: '#app',
        data() {
            // 确认密码验证规则
            const validateConfirmPassword = (rule, value, callback) => {
                if (value === '') {
                    callback(new Error('请再次输入密码'));
                } else if (value !== this.registerForm.password) {
                    callback(new Error('两次输入密码不一致'));
                } else {
                    callback();
                }
            };

            return {
                loading: false,
                showRegisterDialog: false,
                registerLoading: false,
                checkingUsername: false,
                usernameStatus: '', // '', 'checking', 'available', 'exists'

                loginForm: {
                    username: '',
                    password: ''
                },

                registerForm: {
                    username: '',
                    password: '',
                    confirmPassword: '',
                    realName: '',
                    phone: ''
                },

                loginRules: {
                    username: [
                        { required: true, message: '请输入用户名', trigger: 'blur' }
                    ],
                    password: [
                        { required: true, message: '请输入密码', trigger: 'blur' }
                    ]
                },

                registerRules: {
                    username: [
                        { required: true, message: '请输入用户名', trigger: 'blur' },
                        { min: 3, max: 20, message: '用户名长度在 3 到 20 个字符', trigger: 'blur' },
                        { pattern: /^[a-zA-Z0-9_]+$/, message: '用户名只能包含字母、数字和下划线', trigger: 'blur' }
                    ],
                    password: [
                        { required: true, message: '请输入密码', trigger: 'blur' },
                        { min: 6, max: 20, message: '密码长度在 6 到 20 个字符', trigger: 'blur' }
                    ],
                    confirmPassword: [
                        { required: true, message: '请确认密码', trigger: 'blur' },
                        { validator: validateConfirmPassword, trigger: 'blur' }
                    ],
                    realName: [
                        { required: true, message: '请输入真实姓名', trigger: 'blur' },
                        { min: 2, max: 20, message: '真实姓名长度在 2 到 20 个字符', trigger: 'blur' }
                    ],
                    phone: [
                        { required: true, message: '请输入手机号码', trigger: 'blur' },
                        // { pattern: /^1[3-9]\d{9}$/, message: '请输入正确的手机号码', trigger: 'blur' }
                    ]
                }
            }
        },
        mounted() {
            // 检查是否已登录，如果已登录则跳转到主页
            const token = localStorage.getItem('token');
            if (token) {
                window.location.href = '/index.html';
            }

            // 自动填充演示账户
            this.loginForm.username = 'bty';
            this.loginForm.password = '123456';
        },
        methods: {
            async handleLogin() {
                this.$refs.loginForm.validate(async (valid) => {
                    if (valid) {
                        this.loading = true;

                        try {
                            const response = await axios.post('/api/auth/login', {
                                username: this.loginForm.username,
                                password: this.loginForm.password
                            });

                            if (response.data && response.data.success) {
                                this.$message.success('登录成功');
                                // 保存token和用户信息
                                localStorage.setItem('token', response.data.data.token);
                                localStorage.setItem('userInfo', JSON.stringify(response.data.data.user));
                                // 跳转到主页
                                setTimeout(() => {
                                    window.location.href = '/index.html';
                                }, 1000);
                            } else {
                                this.$message.error(response.data.message || '登录失败');
                            }
                        } catch (error) {
                            console.error('登录失败:', error);
                            this.$message.error('登录失败，请重试');
                        } finally {
                            this.loading = false;
                        }
                    }
                });
            },

            // 检查用户名是否可用
            async checkUsername() {
                if (!this.registerForm.username) {
                    return;
                }

                this.checkingUsername = true;
                this.usernameStatus = 'checking';

                try {
                    const response = await axios.post('/api/users/check-username', {
                        username: this.registerForm.username
                    });

                    if (response.data && response.data.success) {
                        const exists = response.data.data.exists;
                        this.usernameStatus = exists ? 'exists' : 'available';

                        if (exists) {
                            this.$message.warning('用户名已存在');
                        }
                    }
                } catch (error) {
                    console.error('检查用户名失败:', error);
                    this.usernameStatus = '';
                    this.$message.error('检查用户名失败');
                } finally {
                    this.checkingUsername = false;
                }
            },

            // 注册
            async handleRegister() {
                this.$refs.registerForm.validate(async (valid) => {
                    if (valid && this.usernameStatus === 'available') {
                        this.registerLoading = true;

                        try {
                            const response = await axios.post('/api/auth/register', {
                                username: this.registerForm.username,
                                password: this.registerForm.password,
                                realName: this.registerForm.realName,
                                phone: this.registerForm.phone,
                                role: 'member'
                            });

                            if (response.data && response.data.success) {
                                this.$message.success('注册成功！');
                                this.showRegisterDialog = false;

                                // 自动填充登录表单
                                this.loginForm.username = this.registerForm.username;
                                this.loginForm.password = '';

                                this.$message({
                                    message: '注册成功，请登录',
                                    type: 'success',
                                    duration: 3000
                                });
                            } else {
                                this.$message.error(response.data.message || '注册失败');
                            }
                        } catch (error) {
                            console.error('注册失败:', error);
                            if (error.response && error.response.data) {
                                this.$message.error(error.response.data.message || '注册失败');
                            } else {
                                this.$message.error('网络错误，请稍后重试');
                            }
                        } finally {
                            this.registerLoading = false;
                        }
                    } else {
                        if (this.usernameStatus !== 'available') {
                            this.$message.warning('请先检查用户名是否可用');
                        }
                    }
                });
            },

            // 注册对话框关闭
            handleRegisterClose() {
                this.$refs.registerForm.clearValidate();
                this.registerForm = {
                    username: '',
                    password: '',
                    confirmPassword: '',
                    realName: '',
                    phone: ''
                };
                this.usernameStatus = '';
            }
        }
    });
</script>
</body>
</html>
