<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的器材预约</title>
    <link rel="stylesheet" href="css/lib/all.min.css">
    <link rel="stylesheet" href="css/index.css">
    <style>
        .container {
            padding: 20px;
        }
        .filter-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .filter-row {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .filter-item label {
            white-space: nowrap;
        }
        .filter-item select {
            padding: 5px 10px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin-right: 5px;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-danger {
            background-color: #dc3545;
            color: white;
        }
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
        .status-pending {
            color: #ffc107;
            font-weight: bold;
        }
        .status-approved {
            color: #28a745;
            font-weight: bold;
        }
        .status-rejected {
            color: #dc3545;
            font-weight: bold;
        }
        .status-cancelled {
            color: #6c757d;
            font-weight: bold;
        }
        .action-buttons button {
            margin-right: 5px;
            padding: 3px 8px;
            font-size: 12px;
        }
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 20px;
            border-radius: 5px;
            width: 80%;
            max-width: 600px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .close {
            font-size: 24px;
            cursor: pointer;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 3px;
            box-sizing: border-box;
        }
        .modal-footer {
            margin-top: 20px;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2><i class="fas fa-calendar-check"></i> 我的器材预约</h2>
        
        <!-- 筛选区 -->
        <div class="filter-section">
            <div class="filter-row">
                <div class="filter-item">
                    <label for="searchStatus">状态:</label>
                    <select id="searchStatus">
                        <option value="">全部</option>
                        <option value="PENDING">待审核</option>
                        <option value="APPROVED">已批准</option>
                        <option value="REJECTED">已拒绝</option>
                        <option value="CANCELLED">已取消</option>
                    </select>
                </div>
                <div class="filter-item">
                    <button class="btn btn-primary" onclick="loadMyReservations()">
                        <i class="fas fa-search"></i> 搜索
                    </button>
                    <button class="btn btn-secondary" onclick="resetFilters()">
                        <i class="fas fa-sync"></i> 重置
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 预约记录列表 -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>器材名称</th>
                        <th>预约日期</th>
                        <th>开始时间</th>
                        <th>结束时间</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="reservationsTableBody">
                    <!-- 数据将通过JavaScript动态加载 -->
                </tbody>
            </table>
        </div>
        
        <!-- 分页组件 -->
        <div class="pagination" id="pagination">
            <!-- 分页控件将通过JavaScript动态生成 -->
        </div>
    </div>
    
    <!-- 详情对话框 -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>预约详情</h3>
                <span class="close" onclick="closeDetailModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>预约ID:</label>
                    <input type="text" id="detailId" readonly>
                </div>
                <div class="form-group">
                    <label>器材名称:</label>
                    <input type="text" id="detailEquipmentName" readonly>
                </div>
                <div class="form-group">
                    <label>预约日期:</label>
                    <input type="text" id="detailDate" readonly>
                </div>
                <div class="form-group">
                    <label>开始时间:</label>
                    <input type="text" id="detailStartTime" readonly>
                </div>
                <div class="form-group">
                    <label>结束时间:</label>
                    <input type="text" id="detailEndTime" readonly>
                </div>
                <div class="form-group">
                    <label>状态:</label>
                    <input type="text" id="detailStatus" readonly>
                </div>
                <div class="form-group">
                    <label>创建时间:</label>
                    <input type="text" id="detailCreateTime" readonly>
                </div>
                <div class="form-group">
                    <label>审核备注:</label>
                    <textarea id="detailComment" rows="3" readonly></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeDetailModal()">关闭</button>
            </div>
        </div>
    </div>
    
    <script src="js/lib/axios.min.js"></script>
    <script>
        // 全局变量
        let currentPage = 1;
        const pageSize = 10;
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadMyReservations();
        });
        
        // 加载我的预约记录
        function loadMyReservations(page = 1) {
            currentPage = page;
            
            // 获取筛选条件
            const status = document.getElementById('searchStatus').value;
            
            // 构造查询参数
            const params = {
                page: currentPage,
                size: pageSize
            };
            
            if (status) params.status = status;
            
            // 发送请求
            axios.get('/api/equipment-reservations/my', { params })
                .then(response => {
                    const data = response.data;
                    renderTable(data.content);
                    renderPagination(data.totalPages, data.number + 1);
                })
                .catch(error => {
                    console.error('加载预约记录失败:', error);
                    alert('加载预约记录失败');
                });
        }
        
        // 渲染表格数据
        function renderTable(reservations) {
            const tbody = document.getElementById('reservationsTableBody');
            tbody.innerHTML = '';
            
            if (!reservations || reservations.length === 0) {
                const tr = document.createElement('tr');
                tr.innerHTML = '<td colspan="7" style="text-align: center;">暂无数据</td>';
                tbody.appendChild(tr);
                return;
            }
            
            reservations.forEach(reservation => {
                const tr = document.createElement('tr');
                
                // 格式化状态显示
                let statusText = '';
                let statusClass = '';
                switch (reservation.status) {
                    case 'PENDING':
                        statusText = '待审核';
                        statusClass = 'status-pending';
                        break;
                    case 'APPROVED':
                        statusText = '已批准';
                        statusClass = 'status-approved';
                        break;
                    case 'REJECTED':
                        statusText = '已拒绝';
                        statusClass = 'status-rejected';
                        break;
                    case 'CANCELLED':
                        statusText = '已取消';
                        statusClass = 'status-cancelled';
                        break;
                    default:
                        statusText = reservation.status;
                }
                
                tr.innerHTML = `
                    <td>${reservation.id}</td>
                    <td>${reservation.equipmentName || '-'}</td>
                    <td>${reservation.date}</td>
                    <td>${reservation.startTime}</td>
                    <td>${reservation.endTime}</td>
                    <td class="${statusClass}">${statusText}</td>
                    <td class="action-buttons">
                        <button class="btn btn-secondary" onclick="openDetailModal(${reservation.id})">详情</button>
                        ${reservation.status === 'PENDING' || reservation.status === 'APPROVED' ? 
                            `<button class="btn btn-danger" onclick="cancelReservation(${reservation.id})">取消</button>` : ''}
                    </td>
                `;
                
                tbody.appendChild(tr);
            });
        }
        
        // 渲染分页控件
        function renderPagination(totalPages, currentPage) {
            const pagination = document.getElementById('pagination');
            pagination.innerHTML = '';
            
            if (totalPages <= 1) return;
            
            // 上一页按钮
            if (currentPage > 1) {
                const prevButton = document.createElement('button');
                prevButton.className = 'btn btn-secondary';
                prevButton.textContent = '上一页';
                prevButton.onclick = () => loadMyReservations(currentPage - 1);
                pagination.appendChild(prevButton);
            }
            
            // 页码按钮
            for (let i = 1; i <= totalPages; i++) {
                const pageButton = document.createElement('button');
                pageButton.className = `btn ${i === currentPage ? 'btn-primary' : 'btn-secondary'}`;
                pageButton.textContent = i;
                pageButton.onclick = () => loadMyReservations(i);
                pagination.appendChild(pageButton);
            }
            
            // 下一页按钮
            if (currentPage < totalPages) {
                const nextButton = document.createElement('button');
                nextButton.className = 'btn btn-secondary';
                nextButton.textContent = '下一页';
                nextButton.onclick = () => loadMyReservations(currentPage + 1);
                pagination.appendChild(nextButton);
            }
        }
        
        // 重置筛选条件
        function resetFilters() {
            document.getElementById('searchStatus').value = '';
            loadMyReservations();
        }
        
        // 取消预约
        function cancelReservation(reservationId) {
            if (!confirm('确定要取消这个预约吗？')) {
                return;
            }
            
            axios.put(`/api/equipment-reservations/${reservationId}/cancel`)
                .then(response => {
                    alert('取消成功');
                    loadMyReservations(currentPage);
                })
                .catch(error => {
                    console.error('取消失败:', error);
                    alert('取消失败');
                });
        }
        
        // 打开详情对话框
        function openDetailModal(reservationId) {
            axios.get(`/api/equipment-reservations/${reservationId}`)
                .then(response => {
                    const reservation = response.data;
                    
                    // 填充详情数据
                    document.getElementById('detailId').value = reservation.id;
                    document.getElementById('detailEquipmentName').value = reservation.equipmentName || '-';
                    document.getElementById('detailDate').value = reservation.date;
                    document.getElementById('detailStartTime').value = reservation.startTime;
                    document.getElementById('detailEndTime').value = reservation.endTime;
                    
                    // 格式化状态显示
                    let statusText = '';
                    switch (reservation.status) {
                        case 'PENDING':
                            statusText = '待审核';
                            break;
                        case 'APPROVED':
                            statusText = '已批准';
                            break;
                        case 'REJECTED':
                            statusText = '已拒绝';
                            break;
                        case 'CANCELLED':
                            statusText = '已取消';
                            break;
                        default:
                            statusText = reservation.status;
                    }
                    document.getElementById('detailStatus').value = statusText;
                    
                    document.getElementById('detailCreateTime').value = reservation.createTime;
                    document.getElementById('detailComment').value = reservation.comment || '';
                    
                    // 显示对话框
                    document.getElementById('detailModal').style.display = 'block';
                })
                .catch(error => {
                    console.error('获取预约详情失败:', error);
                    alert('获取预约详情失败');
                });
        }
        
        // 关闭详情对话框
        function closeDetailModal() {
            document.getElementById('detailModal').style.display = 'none';
        }
        
        // 点击模态框外部关闭
        window.onclick = function(event) {
            const detailModal = document.getElementById('detailModal');
            
            if (event.target === detailModal) {
                closeDetailModal();
            }
        }
    </script>
</body>
</html>
