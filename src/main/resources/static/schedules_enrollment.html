
<link rel="stylesheet" href="css/schedules_enrollment.css">

<div class="enrollment-management">
    <h1 class="page-title">报名管理</h1>
    <!-- 工具栏 -->
    <div class="toolbar">
        <el-button
                type="primary"
                @click="handleBatchApprove"
                :disabled="selectedIds.length === 0"
                icon="el-icon-check"
        >
            批量审核通过
        </el-button>

        <div class="search-box">
            <el-input
                    v-model="searchKeyword"
                    placeholder="搜索学员姓名或课程名称"
                    clearable
                    @clear="handleSearch"
                    @keyup.enter="handleSearch"
                    style="width: 300px;"
            >
                <template #append>
                    <el-button @click="handleSearch" icon="el-icon-search"></el-button>
                </template>
            </el-input>

            <el-select v-model="filterStatus" placeholder="状态筛选" clearable @change="handleSearch">
                <el-option label="未审核" value="0"></el-option>
                <el-option label="已审核" value="1"></el-option>
            </el-select>
        </div>
    </div>

    <!-- 报名表格 -->
    <div class="table-container">
        <el-table
                :data="enrollments"
                v-loading="loading"
                empty-text="暂无报名数据"
                style="width: 100%"
                @selection-change="handleSelectionChange"
        >
            <el-table-column type="selection" width="55"></el-table-column>
            <el-table-column prop="id" label="ID" width="80"></el-table-column>
            <el-table-column prop="realName" label="学员姓名" width="120"></el-table-column>
            <el-table-column prop="courseTitle" label="课程名称" min-width="150"></el-table-column>
            <el-table-column prop="coachName" label="教练" width="120"></el-table-column>
            <el-table-column prop="roomName" label="教室" width="120"></el-table-column>
            <el-table-column label="上课时间" width="180">
                <template slot-scope="scope">
                    {{ formatDate(scope.row.startTime) }}
                </template>
            </el-table-column>
            <el-table-column prop="phone" label="手机号" width="130"></el-table-column>
            <el-table-column prop="notes" label="备注" min-width="200" show-overflow-tooltip></el-table-column>
            <el-table-column prop="status" label="状态" width="100">
                <template slot-scope="scope">
                    <el-tag
                            :type="scope.row.status === 1 ? 'success' : 'warning'"
                            size="small"
                    >
                        {{ scope.row.status === 1 ? '已审核' : '未审核' }}
                    </el-tag>
                </template>
            </el-table-column>
            <el-table-column label="操作" width="200" fixed="right">
                <template slot-scope="scope">
                    <div class="action-buttons">
                        <el-button
                                v-if="scope.row.status === 0"
                                size="small"
                                type="success"
                                @click="handleApprove(scope.row)"
                                icon="el-icon-check"
                        >
                            审核通过
                        </el-button>
                        <el-button
                                v-if="scope.row.status === 1"
                                size="small"
                                type="warning"
                                @click="handleCancelApproval(scope.row)"
                                icon="el-icon-close"
                        >
                            取消审核
                        </el-button>
                        <el-button
                                size="small"
                                type="danger"
                                @click="handleDelete(scope.row)"
                                icon="el-icon-delete"
                        >
                            删除
                        </el-button>
                    </div>
                </template>
            </el-table-column>
        </el-table>
    </div>

    <!-- 分页 -->
    <div class="pagination">
        <el-pagination
                :current-page="currentPage"
                :page-size="pageSize"
                :page-sizes="[10, 20, 50, 100]"
                :total="total"
                layout="total, sizes, prev, pager, next, jumper"
                @size-change="handleSizeChange"
                @current-change="handleCurrentChange"
        />
    </div>
</div>

<script>
    new Vue({
        el: '.enrollment-management',
        data() {
            return {
                enrollments: [],
                loading: false,
                currentPage: 1,
                pageSize: 10,
                total: 0,
                searchKeyword: '',
                filterStatus: '',
                selectedIds: []
            }
        },
        mounted() {
            this.loadEnrollments();
        },
        methods: {
            // 加载报名列表
            loadEnrollments() {
                this.loading = true;
                axios.get('/api/enrollments', {
                    params: {
                        page: this.currentPage,
                        pageSize: this.pageSize,
                        keyword: this.searchKeyword,
                        status: this.filterStatus
                    }
                }).then(response => {
                    if (response.data.success) {
                        this.enrollments = response.data.data;
                        this.total = response.data.total;
                    } else {
                        this.$message.error(response.data.message || '加载失败');
                    }
                }).catch(error => {
                    console.error('加载失败:', error);
                    this.$message.error('加载失败');
                }).finally(() => {
                    this.loading = false;
                });
            },

            // 审核通过
            handleApprove(enrollment) {
                this.$confirm(`确定要审核通过 "${enrollment.realName}" 的报名吗？`, '审核确认', {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'success',
                }).then(() => {
                    axios.post(`/api/enrollments/${enrollment.id}/approve`)
                        .then(response => {
                            if (response.data.success) {
                                this.$message.success('审核通过');
                                this.loadEnrollments();
                            } else {
                                this.$message.error(response.data.message || '审核失败');
                            }
                        })
                        .catch(error => {
                            console.error('审核失败:', error);
                            this.$message.error('审核失败');
                        });
                }).catch(() => {});
            },

            // 批量审核
            handleBatchApprove() {
                this.$confirm(`确定要批量审核通过选中的 ${this.selectedIds.length} 条报名吗？`, '批量审核确认', {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'success',
                }).then(() => {
                    axios.post('/api/enrollments/batch-approve', this.selectedIds)
                        .then(response => {
                            if (response.data.success) {
                                this.$message.success(response.data.message);
                                this.selectedIds = [];
                                this.loadEnrollments();
                            } else {
                                this.$message.error(response.data.message || '批量审核失败');
                            }
                        })
                        .catch(error => {
                            console.error('批量审核失败:', error);
                            this.$message.error('批量审核失败');
                        });
                }).catch(() => {});
            },

            // 取消审核
            handleCancelApproval(enrollment) {
                this.$confirm(`确定要取消 "${enrollment.realName}" 的审核状态吗？`, '取消审核确认', {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'warning',
                }).then(() => {
                    axios.post(`/api/enrollments/${enrollment.id}/cancel-approval`)
                        .then(response => {
                            if (response.data.success) {
                                this.$message.success('取消审核成功');
                                this.loadEnrollments();
                            } else {
                                this.$message.error(response.data.message || '取消审核失败');
                            }
                        })
                        .catch(error => {
                            console.error('取消审核失败:', error);
                            this.$message.error('取消审核失败');
                        });
                }).catch(() => {});
            },

            // 删除报名
            handleDelete(enrollment) {
                this.$confirm(`确定要删除 "${enrollment.realName}" 的报名记录吗？`, '删除确认', {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'error',
                }).then(() => {
                    axios.delete(`/api/enrollments/${enrollment.id}`)
                        .then(response => {
                            if (response.data.success) {
                                this.$message.success('删除成功');
                                this.loadEnrollments();
                            } else {
                                this.$message.error(response.data.message || '删除失败');
                            }
                        })
                        .catch(error => {
                            console.error('删除失败:', error);
                            this.$message.error('删除失败');
                        });
                }).catch(() => {});
            },

            // 选择变化
            handleSelectionChange(selection) {
                this.selectedIds = selection.map(item => item.id);
            },

            // 搜索
            handleSearch() {
                this.currentPage = 1;
                this.loadEnrollments();
            },

            // 分页大小改变
            handleSizeChange(newSize) {
                this.pageSize = newSize;
                this.currentPage = 1;
                this.loadEnrollments();
            },

            // 当前页改变
            handleCurrentChange(newPage) {
                this.currentPage = newPage;
                this.loadEnrollments();
            },

            // 格式化日期
            formatDate(dateString) {
                if (!dateString) return '';
                return new Date(dateString).toLocaleString('zh-CN');
            }
        }
    });
</script>
