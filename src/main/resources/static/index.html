<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content="gym-system"/>
    <meta name="author" content="bty"/>
    <title>健身房管理系统</title>

    <!-- Element UI 样式 -->
    <link rel="stylesheet" href="css/lib/index.min.css">
    <!-- Font Awesome 图标 -->
    <link rel="stylesheet" href="css/lib/all.min.css">
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
<div id="app">
    <!-- 布局容器 -->
    <div class="layout-container">
        <!-- 顶部导航栏 -->
        <header class="top-navbar">
            <div class="navbar-left">
                <i class="fas fa-bars" style="margin-right: 15px; cursor: pointer;" @click="toggleSidebar"></i>
                <span class="navbar-brand">健身房管理系统</span>
            </div>
            <div class="navbar-right">
                <el-dropdown trigger="click" @command="handleUserCommand">
            <span class="el-dropdown-link user-info">
                <div class="user-avatar">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div class="user-details">
                    <div class="user-name">{{ currentUser.real_name || currentUser.username || '用户' }}</div>
                    <div class="user-welcome">欢迎回来</div>
                </div>
                <i class="el-icon-arrow-down el-icon--right dropdown-arrow"></i>
            </span>
                    <el-dropdown-menu slot="dropdown">
                        <el-dropdown-item command="profile"><i class="fas fa-user-cog"></i> 个人设置</el-dropdown-item>
                        <el-dropdown-item divided command="logout"><i class="fas fa-sign-out-alt"></i> 退出登录</el-dropdown-item>
                    </el-dropdown-menu>
                </el-dropdown>
            </div>
        </header>
        <!-- 主内容区域 -->
        <div class="main-container">
            <!-- 侧边栏 -->
            <aside class="sidebar" :class="{ 'collapsed': isSidebarCollapsed }">
                <el-menu
                        class="sidebar-menu"
                        :default-active="currentMenu"
                        :collapse="isSidebarCollapsed"
                        background-color="#304156"
                        text-color="#bfcbd9"
                        active-text-color="#409EFF"
                        :router="false">

                    <!-- 动态渲染菜单 -->
                    <template v-for="menu in userMenus">
                        <!-- 有子菜单的情况 -->
                        <el-submenu
                                v-if="menu.children && menu.children.length > 0"
                                :key="menu.id"
                                :index="menu.index">
                            <template slot="title">
                                <i :class="menu.icon"></i>
                                <span>{{ menu.name }}</span>
                            </template>
                            <el-menu-item
                                    v-for="child in menu.children"
                                    :key="child.id"
                                    :index="child.index"
                                    @click="loadContent(child.index)">
                                <i :class="child.icon"></i>
                                <span>{{ child.name }}</span>
                            </el-menu-item>
                        </el-submenu>

                        <!-- 没有子菜单的情况 -->
                        <el-menu-item
                                v-else
                                :key="menu.id"
                                :index="menu.index"
                                @click="menu.index === 'github' ? openGithub() : loadContent(menu.index)">
                            <i :class="menu.icon"></i>
                            <span slot="title">{{ menu.name }}</span>
                        </el-menu-item>
                    </template>
                </el-menu>
            </aside>

            <!-- 主内容区 -->
            <main class="main-content">
                <div id="content-area">
                    <!-- 内容会动态加载到这里 -->
                </div>
            </main>
        </div>

        <!-- 页脚 -->
        <footer class="footer">
            Copyright &copy; 软件工程课程项目————健身房管理系统
        </footer>
    </div>
</div>

<!-- Vue 和 Element UI -->
<script src="js/lib/vue.min.js"></script>
<script src="js/lib/index.min.js"></script>
<script src="js/lib/axios.min.js"></script>
<script src="js/lib/echarts.min.js"></script>

<!-- 自定义 JavaScript -->
<script src="js/app.js"></script>
</body>
</html>
