<link rel="stylesheet" href="css/coaches.css">

<div class="coach-management">
    <h1 class="page-title">教练管理</h1>
    <!-- 工具栏 -->
    <div class="toolbar">
        <el-button type="primary" @click="handleAddCoach" icon="el-icon-plus">
            添加教练
        </el-button>

        <div class="search-box">
            <el-input
                    v-model="searchKeyword"
                    placeholder="搜索教练姓名或专业"
                    clearable
                    @clear="handleSearch"
                    @keyup.enter="handleSearch"
                    style="width: 300px;"
            >
                <template #append>
                    <el-button @click="handleSearch" icon="el-icon-search"></el-button>
                </template>
            </el-input>
        </div>
    </div>

    <!-- 教练表格 -->
    <div class="table-container">
        <el-table
                :data="coaches"
                v-loading="loading"
                empty-text="暂无教练数据"
                style="width: 100%"
        >
            <el-table-column prop="id" label="ID" width="80"></el-table-column>
            <el-table-column prop="name" label="姓名" width="120"></el-table-column>
            <el-table-column prop="gender" label="性别" width="80">
                <template slot-scope="scope">
                    <el-tag :type="scope.row.gender === '男' ? 'primary' : 'danger'" size="small">
                        {{ scope.row.gender }}
                    </el-tag>
                </template>
            </el-table-column>
            <el-table-column prop="age" label="年龄" width="80"></el-table-column>
            <el-table-column prop="specialty" label="专业特长" min-width="150"></el-table-column>
            <el-table-column prop="phone" label="手机号" width="130">
                <template slot-scope="scope">
                    {{ scope.row.phone || '未填写' }}
                </template>
            </el-table-column>
            <el-table-column label="操作" width="280" fixed="right">
                <template slot-scope="scope">
                    <div class="action-buttons">
                        <el-button
                                size="small"
                                type="info"
                                @click="handleViewDetail(scope.row)"
                                icon="el-icon-view"
                        >
                            详情
                        </el-button>
                        <el-button
                                size="small"
                                @click="handleEditCoach(scope.row)"
                                icon="el-icon-edit"
                        >
                            编辑
                        </el-button>
                        <el-button
                                size="small"
                                type="danger"
                                @click="handleDeleteCoach(scope.row)"
                                icon="el-icon-delete"
                        >
                            删除
                        </el-button>
                    </div>
                </template>
            </el-table-column>
        </el-table>
    </div>

    <!-- 分页 -->
    <div class="pagination">
        <el-pagination
                :current-page="currentPage"
                :page-size="pageSize"
                :page-sizes="[10, 20, 50, 100]"
                :total="total"
                layout="total, sizes, prev, pager, next, jumper"
                @size-change="handleSizeChange"
                @current-change="handleCurrentChange"
        />
    </div>

    <!-- 添加/编辑教练对话框 -->
    <el-dialog
            :title="dialogTitle"
            :visible.sync="dialogVisible"
            width="600px"
            @close="handleDialogClose"
    >
        <el-form
                :model="coachForm"
                :rules="coachRules"
                ref="coachForm"
                label-width="100px"
        >
            <el-form-item label="教练姓名" prop="name">
                <el-input v-model="coachForm.name" placeholder="请输入教练姓名"></el-input>
            </el-form-item>

            <el-row :gutter="20">
                <el-col :span="12">
                    <el-form-item label="性别" prop="gender">
                        <el-radio-group v-model="coachForm.gender">
                            <el-radio label="男">男</el-radio>
                            <el-radio label="女">女</el-radio>
                        </el-radio-group>
                    </el-form-item>
                </el-col>
                <el-col :span="12">
                    <el-form-item label="年龄" prop="age">
                        <el-input-number
                                v-model="coachForm.age"
                                :min="18"
                                :max="65"
                                controls-position="right"
                                style="width: 100%"
                        />
                    </el-form-item>
                </el-col>
            </el-row>

            <el-form-item label="专业特长" prop="specialty">
                <el-select v-model="coachForm.specialty" placeholder="请选择专业特长" style="width: 100%">
                    <el-option label="瑜伽" value="瑜伽"></el-option>
                    <el-option label="动感单车" value="动感单车"></el-option>
                    <el-option label="拳击" value="拳击"></el-option>
                    <el-option label="普拉提" value="普拉提"></el-option>
                    <el-option label="力量训练" value="力量训练"></el-option>
                    <el-option label="舞蹈" value="舞蹈"></el-option>
                    <el-option label="泰拳" value="泰拳"></el-option>
                    <el-option label="康复训练" value="康复训练"></el-option>
                    <el-option label="拉伸" value="拉伸"></el-option>
                </el-select>
            </el-form-item>

            <el-form-item label="手机号" prop="phone">
                <el-input v-model="coachForm.phone" placeholder="请输入手机号（可选）"></el-input>
            </el-form-item>
        </el-form>

        <div slot="footer" class="dialog-footer">
            <el-button @click="dialogVisible = false">取消</el-button>
            <el-button type="primary" @click="handleSaveCoach" :loading="saveLoading">保存</el-button>
        </div>
    </el-dialog>

    <!-- 教练详情对话框 -->
    <el-dialog
            title="教练详情"
            :visible.sync="detailDialogVisible"
            width="600px"
    >
        <el-descriptions :column="2" border v-if="currentCoach">
            <el-descriptions-item label="教练ID">{{ currentCoach.id }}</el-descriptions-item>
            <el-descriptions-item label="教练姓名">{{ currentCoach.name }}</el-descriptions-item>
            <el-descriptions-item label="性别">{{ currentCoach.gender }}</el-descriptions-item>
            <el-descriptions-item label="年龄">{{ currentCoach.age }} 岁</el-descriptions-item>
            <el-descriptions-item label="专业特长">{{ currentCoach.specialty }}</el-descriptions-item>
            <el-descriptions-item label="手机号">{{ currentCoach.phone || '未填写' }}</el-descriptions-item>
            <el-descriptions-item label="创建时间">{{ formatDate(currentCoach.createdAt) }}</el-descriptions-item>
            <el-descriptions-item label="更新时间">{{ formatDate(currentCoach.updatedAt) }}</el-descriptions-item>
        </el-descriptions>

        <div slot="footer" class="dialog-footer">
            <el-button type="primary" @click="detailDialogVisible = false">关闭</el-button>
        </div>
    </el-dialog>
</div>

<script>
    new Vue({
        el: '.coach-management',
        data() {
            // 手机号验证规则
            const validatePhone = (rule, value, callback) => {
                if (value && value !== '') {
                    const phoneRegex = /^1[3-9]\d{9}$/;
                    if (!phoneRegex.test(value)) {
                        callback(new Error('手机号格式不正确'));
                    } else {
                        callback();
                    }
                } else {
                    callback();
                }
            };

            return {
                coaches: [],
                loading: false,
                currentPage: 1,
                pageSize: 10,
                total: 0,
                searchKeyword: '',

                // 对话框相关
                dialogVisible: false,
                detailDialogVisible: false,
                dialogTitle: '添加教练',
                saveLoading: false,
                currentCoach: null,

                // 表单数据
                coachForm: {
                    id: null,
                    name: '',
                    gender: '',
                    age: 25,
                    specialty: '',
                    phone: '',
                },

                // 表单验证规则
                coachRules: {
                    name: [
                        { required: true, message: '请输入教练姓名', trigger: 'blur' },
                        { min: 2, max: 20, message: '姓名长度在 2 到 20 个字符', trigger: 'blur' }
                    ],
                    gender: [
                        { required: true, message: '请选择性别', trigger: 'change' }
                    ],
                    age: [
                        { required: true, message: '请输入年龄', trigger: 'blur' },
                        { type: 'number', min: 18, max: 65, message: '年龄必须在 18 到 65 岁之间', trigger: 'blur' }
                    ],
                    specialty: [
                        { required: true, message: '请选择专业特长', trigger: 'change' }
                    ],
                    phone: [
                        { validator: validatePhone, trigger: 'blur' }
                    ]
                }
            }
        },
        mounted() {
            this.loadCoaches();
        },
        methods: {
            loadCoaches() {
                this.loading = true;

                axios.post('/api/coaches/page', {
                    page: this.currentPage,
                    pageSize: this.pageSize,
                    keyword: this.searchKeyword,
                })
                    .then(response => {
                        if (response.data.success) {
                            this.coaches = response.data.data;
                            this.total = response.data.total;
                        } else {
                            this.$message.error(response.data.message || '加载教练失败');
                        }
                    })
                    .catch(error => {
                        console.error('加载教练失败:', error);
                        this.$message.error('加载教练失败');
                    })
                    .finally(() => {
                        this.loading = false;
                    });
            },

            // 添加教练
            handleAddCoach() {
                this.dialogTitle = '添加教练';
                this.coachForm = {
                    id: null,
                    name: '',
                    gender: '',
                    age: 25,
                    specialty: '',
                    phone: '',
                };
                this.dialogVisible = true;
                this.$nextTick(() => {
                    if (this.$refs.coachForm) {
                        this.$refs.coachForm.clearValidate();
                    }
                });
            },

            // 编辑教练
            handleEditCoach(coach) {
                this.dialogTitle = '编辑教练';
                this.coachForm = {
                    id: coach.id,
                    name: coach.name,
                    gender: coach.gender,
                    age: coach.age,
                    specialty: coach.specialty,
                    phone: coach.phone || ''
                };
                this.dialogVisible = true;
                this.$nextTick(() => {
                    if (this.$refs.coachForm) {
                        this.$refs.coachForm.clearValidate();
                    }
                });
            },

            // 查看详情
            handleViewDetail(coach) {
                this.currentCoach = coach;
                this.detailDialogVisible = true;
            },

            // 保存教练
            handleSaveCoach() {
                this.$refs.coachForm.validate((valid) => {
                    if (valid) {
                        this.saveLoading = true;

                        const apiUrl = this.coachForm.id ? '/api/coaches/update' : '/api/coaches/add';
                        const successMessage = this.coachForm.id ? '更新成功' : '添加成功';

                        axios.post(apiUrl, this.coachForm)
                            .then(response => {
                                if (response.data.success) {
                                    this.$message.success(successMessage);
                                    this.dialogVisible = false;
                                    this.loadCoaches();
                                } else {
                                    this.$message.error(response.data.message || '保存失败');
                                }
                            })
                            .catch(error => {
                                console.error('保存教练失败:', error);
                                this.$message.error('保存失败');
                            })
                            .finally(() => {
                                this.saveLoading = false;
                            });
                    }
                });
            },

            // 删除教练
            handleDeleteCoach(coach) {
                this.$confirm(`确定要删除教练 "${coach.name}" 吗？`, '删除确认', {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'warning',
                }).then(() => {
                    axios.post('/api/coaches/delete', { id: coach.id })
                        .then(response => {
                            if (response.data.success) {
                                this.$message.success('删除成功');
                                this.loadCoaches();
                            } else {
                                this.$message.error(response.data.message || '删除失败');
                            }
                        })
                        .catch(error => {
                            console.error('删除教练失败:', error);
                            this.$message.error('删除失败');
                        });
                }).catch(() => {});
            },

            // 搜索
            handleSearch() {
                this.currentPage = 1;
                this.loadCoaches();
            },

            // 分页
            handleSizeChange(newSize) {
                this.pageSize = newSize;
                this.currentPage = 1;
                this.loadCoaches();
            },

            handleCurrentChange(newPage) {
                this.currentPage = newPage;
                this.loadCoaches();
            },

            // 对话框关闭
            handleDialogClose() {
                this.$refs.coachForm.clearValidate();
            },

            // 工具方法
            formatDate(dateString) {
                if (!dateString) return '';
                return new Date(dateString).toLocaleString('zh-CN');
            }
        }
    });
</script>
