<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统日志管理</title>
    <!-- 引入Vue/Element UI（优先本地资源，避免CDN超时） -->
    <script src="js/lib/vue.min.js"></script>
    <script src="js/lib/axios.min.js"></script>
    <link rel="stylesheet" href="css/lib/index.min.css">
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
    <!-- 引入时间格式化插件 -->
    <script src="js/lib/moment.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(180deg, #f3f6fb 0%, #eef2f7 100%);
            padding: 24px;
        }
        .log-container {
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 40, 80, 0.08);
        }
        .page-title {
            text-align: center;
            margin-bottom: 18px;
            color: #1f2d3d;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .search-form {
            margin-bottom: 18px;
            padding: 16px 18px;
            background: #f9fbff;
            border-radius: 10px;
            border: 1px solid #e6edf7;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 18px;
            margin-bottom: 12px;
        }
        .form-item {
            flex: 1;
            min-width: 180px;
        }
        .form-item .el-form-item {
            display: flex;
            align-items: center;
            margin-bottom: 0;
        }
        .form-item .el-form-item__label {
            width: 80px;
            color: #4a5568;
            font-weight: 500;
            line-height: 32px;
        }
        .form-item .el-form-item__content {
            flex: 1;
        }
        .form-item .el-date-editor,
        .form-item .el-select,
        .form-item .el-input {
            width: 100%;
        }
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            padding-top: 4px;
        }
        .table-container {
            margin-top: 12px;
        }
        .el-table {
            --el-table-header-text-color: #303133;
            --el-table-row-hover-bg-color: #f8f9fa;
        }
        .el-table th {
            background: #f6f9ff;
        }
        .status-success {
            color: #67c23a;
            font-weight: 500;
        }
        .status-fail {
            color: #f56c6c;
            font-weight: 500;
        }
        .operation-tag {
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<div id="app" class="log-container">
    <h2 class="page-title">系统日志管理</h2>

    <!-- 搜索表单 -->
    <div class="search-form">
        <el-form :inline="true" :model="searchForm" class="demo-form-inline">
            <div class="form-row">
                <div class="form-item">
                    <el-form-item label="操作人员">
                        <el-input v-model="searchForm.operator" placeholder="请输入操作人员用户名"></el-input>
                    </el-form-item>
                </div>
                <div class="form-item">
                    <el-form-item label="操作类型">
                        <el-select v-model="searchForm.operation" placeholder="请选择操作类型">
                            <el-option label="登录" value="login"></el-option>
                            <el-option label="注册" value="register"></el-option>
                            <el-option label="查询用户列表" value="list_users"></el-option>
                            <el-option label="创建用户" value="create_user"></el-option>
                            <el-option label="编辑用户" value="edit_user"></el-option>
                            <el-option label="删除用户" value="delete_user"></el-option>
                            <el-option label="修改用户状态" value="edit_user_status"></el-option>
                            <el-option label="重置用户密码" value="reset_user_password"></el-option>
                            <el-option label="获取个人信息" value="get_profile"></el-option>
                            <el-option label="修改个人信息" value="edit_profile"></el-option>
                        </el-select>
                    </el-form-item>
                </div>
                <div class="form-item">
                    <el-form-item label="操作状态">
                        <el-select v-model="searchForm.status" placeholder="请选择操作状态">
                            <el-option label="成功" value="success"></el-option>
                            <el-option label="失败" value="fail"></el-option>
                        </el-select>
                    </el-form-item>
                </div>
                <div class="form-item">
                    <el-form-item label="操作时间">
                        <el-date-picker
                                v-model="dateRange"
                                type="daterange"
                                range-separator="-"
                                start-placeholder="开始日期"
                                end-placeholder="结束日期"
                                format="yyyy-MM-dd HH:mm:ss"
                                value-format="yyyy-MM-dd HH:mm:ss">
                        </el-date-picker>
                    </el-form-item>
                </div>
            </div>
            <div class="toolbar">
                <el-button type="primary" @click="searchLogs">查询</el-button>
                <el-button @click="resetSearch">重置</el-button>
                <el-button type="warning" @click="exportLogs">导出</el-button>
                <el-button type="danger" @click="deleteSelected">批量删除</el-button>
                <el-button type="success" @click="openAddLogDialog">新增日志</el-button>
            </div>
        </el-form>
    </div>

    <!-- 日志表格 -->
    <div class="table-container">
        <el-table
                :data="logList"
                border
                stripe
                v-loading="loading"
                element-loading-text="加载中..."
                style="width: 100%;"
                @selection-change="handleSelectionChange"
                @row-dblclick="handleRowDblClick">
            <el-table-column type="selection" width="50" align="center"></el-table-column>
            <el-table-column prop="id" label="日志ID" width="80" align="center"></el-table-column>
            <el-table-column prop="operator" label="操作人员" width="120" align="center"></el-table-column>
            <el-table-column prop="operation" label="操作类型" width="150" align="center">
                <template slot-scope="scope">
                    <el-tag size="mini" type="info">
                        {{ getOperationLabel(scope.row.operation) }}
                    </el-tag>
                </template>
            </el-table-column>
            <el-table-column prop="content" label="操作内容" min-width="300">
                <template slot-scope="scope">
                    <div style="white-space: normal; word-break: break-all;">{{ scope.row.content }}</div>
                </template>
            </el-table-column>
            <el-table-column prop="ipAddress" label="IP地址" width="120" align="center"></el-table-column>
            <el-table-column prop="status" label="操作状态" width="100" align="center">
                <template slot-scope="scope">
                        <span :class="scope.row.status === 'success' ? 'status-success' : 'status-fail'">
                            {{ scope.row.status === 'success' ? '成功' : '失败' }}
                        </span>
                </template>
            </el-table-column>
            <el-table-column prop="operateTime" label="操作时间" width="200" align="center">
                <template slot-scope="scope">
                    {{ formatTime(scope.row.operateTime) }}
                </template>
            </el-table-column>
            <el-table-column label="操作" width="160" align="center">
                <template slot-scope="scope">
                    <el-button size="mini" type="primary" @click="openEditLogDialog(scope.row)">编辑</el-button>
                    <el-button size="mini" type="danger" @click="deleteLog(scope.row)">删除</el-button>
                </template>
            </el-table-column>
        </el-table>

        <!-- 分页控件 -->
        <el-pagination
                @size-change="handleSizeChange"
                @current-change="handleCurrentChange"
                :current-page="currentPage"
                :page-sizes="[10, 20, 50, 100]"
                :page-size="pageSize"
                layout="total, sizes, prev, pager, next, jumper"
                :total="total"
                style="margin-top: 20px; text-align: right;">
        </el-pagination>
    </div>

    <!-- 新增日志弹窗 -->
    <el-dialog title="新增日志" :visible.sync="addLogDialogVisible" width="500px">
        <el-form :model="addLogForm" :rules="addLogRules" ref="addLogForm" label-width="80px">
            <el-form-item label="操作人员" prop="operator">
                <el-input v-model="addLogForm.operator" placeholder="请输入操作人员用户名"></el-input>
            </el-form-item>
            <el-form-item label="操作类型" prop="operation">
                <el-select v-model="addLogForm.operation" placeholder="请选择操作类型">
                    <el-option label="登录" value="login"></el-option>
                    <el-option label="注册" value="register"></el-option>
                    <el-option label="查询用户列表" value="list_users"></el-option>
                    <el-option label="创建用户" value="create_user"></el-option>
                    <el-option label="编辑用户" value="edit_user"></el-option>
                    <el-option label="删除用户" value="delete_user"></el-option>
                    <el-option label="修改用户状态" value="edit_user_status"></el-option>
                    <el-option label="重置用户密码" value="reset_user_password"></el-option>
                    <el-option label="获取个人信息" value="get_profile"></el-option>
                    <el-option label="修改个人信息" value="edit_profile"></el-option>
                </el-select>
            </el-form-item>
            <el-form-item label="操作内容" prop="content">
                <el-input v-model="addLogForm.content" type="textarea" :rows="4" placeholder="请输入详细操作内容"></el-input>
            </el-form-item>
            <el-form-item label="IP地址" prop="ipAddress">
                <el-input v-model="addLogForm.ipAddress" placeholder="请输入IP地址" default="127.0.0.1"></el-input>
            </el-form-item>
            <el-form-item label="操作状态" prop="status">
                <el-select v-model="addLogForm.status" placeholder="请选择操作状态">
                    <el-option label="成功" value="success"></el-option>
                    <el-option label="失败" value="fail"></el-option>
                </el-select>
            </el-form-item>
        </el-form>
        <div slot="footer" class="dialog-footer">
            <el-button @click="addLogDialogVisible = false">取消</el-button>
            <el-button type="primary" @click="submitAddLog">确定</el-button>
        </div>
    </el-dialog>

    <!-- 编辑日志弹窗 -->
    <el-dialog title="编辑日志" :visible.sync="editLogDialogVisible" width="500px">
        <el-form :model="editLogForm" :rules="editLogRules" ref="editLogForm" label-width="80px">
            <el-form-item label="日志ID" prop="id">
                <el-input v-model="editLogForm.id" disabled></el-input>
            </el-form-item>
            <el-form-item label="操作内容" prop="content">
                <el-input v-model="editLogForm.content" type="textarea" :rows="4" placeholder="请输入详细操作内容"></el-input>
            </el-form-item>
            <el-form-item label="操作状态" prop="status">
                <el-select v-model="editLogForm.status" placeholder="请选择操作状态">
                    <el-option label="成功" value="success"></el-option>
                    <el-option label="失败" value="fail"></el-option>
                </el-select>
            </el-form-item>
        </el-form>
        <div slot="footer" class="dialog-footer">
            <el-button @click="editLogDialogVisible = false">取消</el-button>
            <el-button type="primary" @click="submitEditLog">确定</el-button>
        </div>
    </el-dialog>
</div>

<script>
    new Vue({
        el: '#app',
        data() {
            return {
                // 搜索表单
                searchForm: {
                    operator: '',
                    operation: '',
                    status: '',
                    startTime: '',
                    endTime: ''
                },
                dateRange: [],
                // 表格数据
                logList: [],
                selectedRows: [],
                total: 0,
                currentPage: 1,
                pageSize: 10,
                loading: false,
                // 新增弹窗
                addLogDialogVisible: false,
                addLogForm: {
                    operator: '',
                    operation: '',
                    content: '',
                    ipAddress: '127.0.0.1',
                    status: 'success'
                },
                // 编辑弹窗
                editLogDialogVisible: false,
                editLogForm: {
                    id: '',
                    content: '',
                    status: ''
                },
                // 表单校验规则
                addLogRules: {
                    operator: [{ required: true, message: '请输入操作人员', trigger: 'blur' }],
                    operation: [{ required: true, message: '请选择操作类型', trigger: 'change' }],
                    content: [{ required: true, message: '请输入操作内容', trigger: 'blur' }],
                    status: [{ required: true, message: '请选择操作状态', trigger: 'change' }]
                },
                editLogRules: {
                    content: [{ required: true, message: '请输入操作内容', trigger: 'blur' }],
                    status: [{ required: true, message: '请选择操作状态', trigger: 'change' }]
                },
                // 后端接口地址
                baseUrl: 'http://localhost:8081/api'
            }
        },
        created() {
            // 初始化查询日志
            this.searchLogs();
        },
        methods: {
            // 获取操作类型中文标签
            getOperationLabel(operation) {
                const labelMap = {
                    'login': '登录',
                    'register': '注册',
                    'list_users': '查询用户列表',
                    'create_user': '创建用户',
                    'edit_user': '编辑用户',
                    'delete_user': '删除用户',
                    'edit_user_status': '修改用户状态',
                    'reset_user_password': '重置用户密码',
                    'get_profile': '获取个人信息',
                    'edit_profile': '修改个人信息'
                };
                return labelMap[operation] || operation;
            },
            // 格式化时间
            formatTime(time) {
                if (!time) return '';
                return moment(time).format('YYYY-MM-DD HH:mm:ss');
            },
            // 查询日志
            searchLogs() {
                this.loading = true;
                // 处理时间范围
                if (this.dateRange && this.dateRange.length === 2) {
                    this.searchForm.startTime = this.dateRange[0];
                    this.searchForm.endTime = this.dateRange[1];
                } else {
                    this.searchForm.startTime = '';
                    this.searchForm.endTime = '';
                }

                // 构造查询参数
                const params = {
                    startTime: this.searchForm.startTime,
                    endTime: this.searchForm.endTime,
                    operator: this.searchForm.operator,
                    operation: this.searchForm.operation,
                    status: this.searchForm.status,
                    page: this.currentPage,
                    pageSize: this.pageSize
                };

                axios.get(`${this.baseUrl}/logs`, { params })
                    .then(res => {
                        if (res.data.success) {
                            this.logList = res.data.data.list || [];
                            this.total = res.data.data.total || 0;
                            this.selectedRows = [];
                        } else {
                            this.$message.error('查询日志失败：' + (res.data.message || '未知错误'));
                        }
                    })
                    .catch(err => {
                        this.$message.error('查询日志失败：' + err.message);
                    })
                    .finally(() => {
                        this.loading = false;
                    });
            },
            // 重置搜索
            resetSearch() {
                this.searchForm = {
                    operator: '',
                    operation: '',
                    status: '',
                    startTime: '',
                    endTime: ''
                };
                this.dateRange = [];
                this.currentPage = 1;
                this.pageSize = 10;
            },
            // 分页大小改变
            handleSizeChange(val) {
                this.pageSize = val;
                this.searchLogs();
            },
            // 当前页改变
            handleCurrentChange(val) {
                this.currentPage = val;
                this.searchLogs();
            },
            // 表格多选
            handleSelectionChange(rows) {
                this.selectedRows = rows || [];
            },
            // 打开新增日志弹窗
            openAddLogDialog() {
                this.addLogForm = {
                    operator: '',
                    operation: '',
                    content: '',
                    ipAddress: '127.0.0.1',
                    status: 'success'
                };
                this.addLogDialogVisible = true;
            },
            // 提交新增日志
            submitAddLog() {
                this.$refs.addLogForm.validate((valid) => {
                    if (valid) {
                        axios.post(`${this.baseUrl}/logs/add`, this.addLogForm)
                            .then(res => {
                                if (res.data.success) {
                                    this.$message.success('新增日志成功');
                                    this.addLogDialogVisible = false;
                                    this.searchLogs();
                                } else {
                                    this.$message.error('新增日志失败：' + (res.data.message || '未知错误'));
                                }
                            })
                            .catch(err => {
                                this.$message.error('新增日志失败：' + err.message);
                            });
                    } else {
                        return false;
                    }
                });
            },
            // 双击行打开编辑弹窗
            handleRowDblClick(row) {
                this.openEditLogDialog(row);
            },
            // 打开编辑日志弹窗
            openEditLogDialog(row) {
                this.editLogForm = {
                    id: row.id,
                    content: row.content,
                    status: row.status
                };
                this.editLogDialogVisible = true;
            },
            // 提交编辑日志
            submitEditLog() {
                this.$refs.editLogForm.validate((valid) => {
                    if (valid) {
                        axios.post(`${this.baseUrl}/logs/update`, this.editLogForm)
                            .then(res => {
                                if (res.data.success) {
                                    this.$message.success('修改日志成功');
                                    this.editLogDialogVisible = false;
                                    this.searchLogs();
                                } else {
                                    this.$message.error('修改日志失败：' + (res.data.message || '未知错误'));
                                }
                            })
                            .catch(err => {
                                this.$message.error('修改日志失败：' + err.message);
                            });
                    } else {
                        return false;
                    }
                });
            },
            // 删除日志
            deleteLog(row) {
                this.$confirm('确定删除该日志吗？', '提示', { type: 'warning' })
                    .then(() => {
                        axios.delete(`${this.baseUrl}/logs/${row.id}`)
                            .then(res => {
                                if (res.data.success) {
                                    this.$message.success('删除日志成功');
                                    this.searchLogs();
                                } else {
                                    this.$message.error('删除日志失败：' + (res.data.message || '未知错误'));
                                }
                            })
                            .catch(err => {
                                this.$message.error('删除日志失败：' + err.message);
                            });
                    })
                    .catch(() => {});
            },
            // 批量删除
            deleteSelected() {
                if (!this.selectedRows.length) {
                    this.$message.warning('请选择要删除的日志');
                    return;
                }
                const ids = this.selectedRows.map(item => item.id);
                this.$confirm(`确定删除选中的 ${ids.length} 条日志吗？`, '提示', { type: 'warning' })
                    .then(() => {
                        axios.post(`${this.baseUrl}/logs/delete-batch`, { ids })
                            .then(res => {
                                if (res.data.success) {
                                    this.$message.success('批量删除成功');
                                    this.searchLogs();
                                } else {
                                    this.$message.error('批量删除失败：' + (res.data.message || '未知错误'));
                                }
                            })
                            .catch(err => {
                                this.$message.error('批量删除失败：' + err.message);
                            });
                    })
                    .catch(() => {});
            },
            // 导出日志
            exportLogs() {
                // 处理时间范围
                if (this.dateRange && this.dateRange.length === 2) {
                    this.searchForm.startTime = this.dateRange[0];
                    this.searchForm.endTime = this.dateRange[1];
                } else {
                    this.searchForm.startTime = '';
                    this.searchForm.endTime = '';
                }
                const params = {
                    startTime: this.searchForm.startTime,
                    endTime: this.searchForm.endTime,
                    operator: this.searchForm.operator,
                    operation: this.searchForm.operation,
                    status: this.searchForm.status
                };
                axios.get(`${this.baseUrl}/logs/export`, { params, responseType: 'blob' })
                    .then(res => {
                        const blob = new Blob([res.data], { type: 'text/csv;charset=utf-8' });
                        const url = window.URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        const disposition = res.headers['content-disposition'] || '';
                        const match = disposition.match(/filename="?([^";]+)"?/i);
                        const filename = match && match[1] ? match[1] : 'system-logs.csv';
                        link.href = url;
                        link.download = decodeURIComponent(filename);
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        window.URL.revokeObjectURL(url);
                        this.$message.success('导出成功');
                    })
                    .catch(err => {
                        this.$message.error('导出失败：' + err.message);
                    });
            }
        }
    })
</script>
</body>
</html>
