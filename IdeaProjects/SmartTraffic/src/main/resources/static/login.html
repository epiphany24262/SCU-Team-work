<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧交通管理系统 - 登录</title>
    <link rel="stylesheet" href="css/lib/index.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h1>智慧交通管理系统</h1>
            <p>Smart Traffic Management System</p>
        </div>

        <div id="loginForm">
            <div class="role-selector">
                <label>选择登录角色</label>
                <div class="role-options">
                    <div class="role-option" data-role="manager" onclick="selectRole('manager')">
                        <i class="el-icon-user"></i>
                        <span>管理员</span>
                    </div>
                    <div class="role-option selected" data-role="user" onclick="selectRole('user')">
                        <i class="el-icon-user-solid"></i>
                        <span>普通用户</span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>用户名</label>
                <input type="text"
                       id="username"
                       class="form-control"
                       placeholder="请输入用户名"
                       value="">
            </div>

            <div class="form-group">
                <label>密码</label>
                <div class="password-wrapper">
                    <input type="password"
                           id="password"
                           class="form-control"
                           placeholder="请输入密码"
                           value="">
                    <button type="button" class="password-toggle" onclick="togglePassword()">
                        <i class="el-icon-view"></i>
                    </button>
                </div>
            </div>

            <div class="login-error" id="loginError"></div>

            <button type="button"
                    class="login-btn"
                    onclick="handleLogin()"
                    id="loginBtn">
                登 录
            </button>

            <div class="form-actions">
                <span>没有账号？</span>
                <a href="javascript:void(0)" onclick="openRegister()">立即注册</a>
            </div>
        </div>
    </div>
</div>

<div class="modal-mask" id="registerModal">
    <div class="modal">
        <h3>用户注册</h3>
        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="regUsername" class="form-control" placeholder="3-20位字母/数字/下划线">
        </div>
        <div class="form-group">
            <label>姓名</label>
            <input type="text" id="regRealName" class="form-control" placeholder="请输入姓名">
        </div>
        <div class="form-group">
            <label>手机号（可选）</label>
            <input type="text" id="regPhone" class="form-control" placeholder="请输入手机号">
        </div>
        <div class="form-group">
            <label>邮箱（可选）</label>
            <input type="text" id="regEmail" class="form-control" placeholder="请输入邮箱">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="regPassword" class="form-control" placeholder="6-32位密码">
        </div>
        <div class="form-group">
            <label>确认密码</label>
            <input type="password" id="regConfirmPassword" class="form-control" placeholder="再次输入密码">
        </div>
        <div class="login-error" id="registerError"></div>
        <div class="modal-actions">
            <button class="btn-secondary" type="button" onclick="closeRegister()">取消</button>
            <button class="btn-primary" type="button" onclick="submitRegister()">注册</button>
        </div>
    </div>
</div>

<script>
    // 当前选中的角色
    let currentRole = 'manager';

    // 选择角色
    function selectRole(role) {
        currentRole = role;

        // 更新UI选择状态
        document.querySelectorAll('.role-option').forEach(option => {
            option.classList.remove('selected');
        });
        document.querySelector(`.role-option[data-role="${role}"]`).classList.add('selected');

        // 清空错误信息
        document.getElementById('loginError').textContent = '';
    }

    // 切换密码显示/隐藏
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.querySelector('.password-toggle i');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleBtn.className = 'el-icon-close';
        } else {
            passwordInput.type = 'password';
            toggleBtn.className = 'el-icon-view';
        }
    }

    // 处理登录
    async function handleLogin() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const loginError = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');

        // 验证输入
        if (!username) {
            loginError.textContent = '请输入用户名';
            return;
        }

        if (!password) {
            loginError.textContent = '请输入密码';
            return;
        }

        // 禁用登录按钮
        loginBtn.disabled = true;
        loginBtn.innerHTML = '登录中...';

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, role: currentRole })
            });
            const result = await response.json();
            if (result.success) {
                const data = result.data || {};
                const roleCode = data.roleCode || 'OPERATOR';
                const role = roleCode === 'SUPER_ADMIN' || roleCode === 'ADMIN' ? 'manager' : 'user';
                const userData = {
                    username: data.username || username,
                    role: role,
                    roleName: data.roleName || (role === 'manager' ? '管理员' : '普通用户'),
                    loginTime: new Date().toISOString()
                };
                localStorage.setItem('traffic_user', JSON.stringify(userData));
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'index.html';
            } else {
                loginError.textContent = result.message || '登录失败，请稍后重试';
            }
        } catch (e) {
            loginError.textContent = '登录异常，请检查网络或服务状态';
        } finally {
            loginBtn.disabled = false;
            loginBtn.innerHTML = '登 录';
        }
    }

    function openRegister() {
        document.getElementById('registerError').textContent = '';
        document.getElementById('registerModal').style.display = 'flex';
    }

    function closeRegister() {
        document.getElementById('registerModal').style.display = 'none';
    }

    async function submitRegister() {
        const username = document.getElementById('regUsername').value.trim();
        const realName = document.getElementById('regRealName').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value.trim();
        const confirmPassword = document.getElementById('regConfirmPassword').value.trim();
        const registerError = document.getElementById('registerError');

        registerError.textContent = '';

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, realName, phone, email, password, confirmPassword })
            });
            const result = await response.json();
            if (result.success) {
                closeRegister();
                document.getElementById('username').value = username;
                document.getElementById('password').value = '';
                document.getElementById('loginError').textContent = '注册成功，请登录';
            } else {
                registerError.textContent = result.message || '注册失败，请稍后重试';
            }
        } catch (e) {
            registerError.textContent = '注册异常，请检查网络或服务状态';
        }
    }

    // 添加回车键登录功能
    document.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            const loginBtn = document.getElementById('loginBtn');
            if (loginBtn && !loginBtn.disabled) {
                handleLogin();
            }
        }
    });

    // 页面加载时初始化
    window.onload = function() {
        // 检查是否已登录
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        if (isLoggedIn) {
            window.location.href = 'index.html';
        }

        selectRole('user');
    };
</script>
</body>
</html>
